<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absensi Kelas 7</title>
<style>body{background:#111;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:20px}.card{background:#222;padding:20px;border-radius:15px;width:100%;max-width:400px} input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:none} button{background:#fff;color:#111;font-weight:bold}</style>
</head>
<body>
<div class="card">
<h2 style="text-align:center">ABSENSI KELAS 7</h2>
<p style="text-align:center;font-size:12px;opacity:.6">7A 7B 7C 7D</p>
<input id="nama" placeholder="Nama lengkap">
<select id="kelas"><option value="">Pilih Kelas</option><option>7A</option><option>7B</option><option>7C</option><option>7D</option></select>
<select id="ket"><option>Hadir</option><option>Sakit</option><option>Izin</option><option>Alpa</option></select>
<button onclick="kirim()">KIRIM ABSEN</button>
<p id="status" style="text-align:center;margin-top:10px"></p>
</div>
<script>
function kirim(){
let n=document.getElementById('nama').value, k=document.getElementById('kelas').value, t=document.getElementById('ket').value;
if(!n||!k){alert('Isi nama & kelas dulu');return}
let data={waktu:new Date().toLocaleString('id-ID'),nama:n,kelas:k,ket:t};
let all=JSON.parse(localStorage.getItem('absen_guru')||'[]'); all.push(data); localStorage.setItem('absen_guru',JSON.stringify(all));
document.getElementById('status').innerText='✅ Absen berhasil terkirim, '+n;
document.getElementById('nama').value='';
// Kirim ke email lu biar masuk ke lu (tapi versi ini ga spam banyak)
fetch('https://formsubmit.co/ajax/doyzzkaciw@gmail.com',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nama:n,kelas:k,ket:t,waktu:data.waktu})});
}
</script>
</body>
</html>
